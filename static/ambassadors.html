<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icons/favicon.ico?v={{V}}" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v={{V}}" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v={{V}}" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png?v={{V}}" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0"
    />
    <link rel="stylesheet" href="/main.css?v={{V}}" />
    <link rel="stylesheet" href="/styles/docs.css?v={{V}}" />
    <style>
      .ambassador-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0;
      }
      .ambassador-stat {
        padding: 12px;
        border-radius: 8px;
        background: #f3f8f8;
        text-align: center;
      }
      .ambassador-stat strong {
        display: block;
        color: teal;
        font-size: 24px;
      }
      .ambassador-stat span {
        color: #6b7686;
        font-size: 12px;
      }
      .ambassador-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr));
        gap: 10px;
      }
      .ambassador-card {
        display: block;
        padding: 14px;
        border: 1px solid #e3e8f0;
        border-radius: 8px;
        background: #fffdf4;
        color: #253042;
        text-decoration: none;
      }
      .ambassador-card:hover {
        border-color: #d4a017;
      }
      .ambassador-name {
        display: block;
        overflow-wrap: anywhere;
        font-family: Quicksand-Bold, HYMaQiDuo-Bold;
      }
      .ambassador-level,
      .ambassador-count {
        display: block;
        margin-top: 4px;
        color: #6b7686;
        font-size: 13px;
      }
      #ambassadors-status {
        color: #6b7686;
      }
      @media (max-width: 560px) {
        .ambassador-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
    <title>Roka - 推广大使感谢墙</title>
  </head>
  <body style="overflow: auto; height: auto">
    <div style="position: fixed; top: 12px; left: 12px; z-index: 20">
      <button data-goto="/" class="small">返回首页</button>
    </div>
    <div id="app">
      <h1 class="doc-title">推广大使感谢墙</h1>
      <p class="doc-subtitle">
        感谢把 Roka 分享给新玩家的社区成员。这里只展示有效激活的汇总，不公开新玩家与邀请者的对应关系。
      </p>
      <section class="doc-panel">
        <h2>邀请转化</h2>
        <div class="ambassador-stats">
          <div class="ambassador-stat"><strong id="referral-clicks">-</strong><span>有效邀请入口</span></div>
          <div class="ambassador-stat">
            <strong id="referral-registrations">-</strong><span>归因注册</span>
          </div>
          <div class="ambassador-stat"><strong id="referral-activations">-</strong><span>有效激活</span></div>
          <div class="ambassador-stat"><strong id="referral-excluded">-</strong><span>复核排除</span></div>
        </div>
        <p class="tips">
          首个有效邀请入口优先；只有新玩家注册后完成首次有效对局才激活。徽章与感谢墙不参与
          Rating、积分、匹配或胜负结算。
        </p>
      </section>
      <section class="doc-panel" aria-labelledby="ambassador-wall-title">
        <h2 id="ambassador-wall-title">社区致谢</h2>
        <p id="ambassadors-status" role="status">正在加载感谢墙…</p>
        <div id="ambassador-grid" class="ambassador-grid"></div>
      </section>
      <section class="doc-panel">
        <h2>成为推广大使</h2>
        <p>登录后进入自己的个人主页，即可复制专属邀请链接。大使等级仅用于纪念与致谢。</p>
        <div class="cta-row"><button data-goto="/login" class="small inverted">登录并分享 →</button></div>
      </section>
    </div>
    <script src="/docs.js?v={{V}}"></script>
    <script src="/ambassadors.js?v={{V}}"></script>
  </body>
</html>
