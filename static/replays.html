<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icons/favicon.ico?v={{V}}" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v={{V}}" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v={{V}}" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png?v={{V}}" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0"
    />
    <link rel="stylesheet" href="/main.css?v={{V}}" />
    <link rel="stylesheet" href="/styles/site-header.css?v={{V}}" />
    <script src="/vendor/jquery/jquery-3.6.0.min.js?v={{V}}"></script>
    <script src="/username.js?v={{V}}"></script>
    <script defer src="/site-header.js?v={{V}}"></script>
    <title>回放 - Roka</title>
    <link rel="stylesheet" href="/styles/home.css?v={{V}}" />
    <link rel="stylesheet" href="/styles/docs.css?v={{V}}" />
    <link rel="stylesheet" href="/styles/rating.css?v={{V}}" />
    <style>
      .replay-query,
      .replay-pagination {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }
      .replay-query label {
        display: grid;
        gap: 6px;
      }
      .replay-query input {
        padding: 8px;
        border: 1px solid #c6dddd;
        border-radius: 6px;
        max-width: 100%;
      }
      .replay-table-wrap {
        overflow-x: auto;
        margin: 14px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 12px 8px;
        border-bottom: 1px solid #e3eeee;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover {
        background: #effafa;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script src="/vendor/socket.io/socket.io-4.0.1.js?v={{V}}"></script>
    <script defer src="/replays.js?v={{V}}"></script>
  </head>
  <body class="home">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="/" aria-label="Roka 首页"
          ><img
            class="brand-icon"
            src="/icons/icon-48.png?v={{V}}"
            srcset="/icons/icon-48.png?v={{V}} 1x, /icons/icon-192.png?v={{V}} 2x"
            alt="Roka 图标"
          /><span class="brand-name">Roka</span></a
        >
        <nav class="site-nav" aria-label="站点导航">
          <a class="site-nav-link" href="/">首页</a
          ><a class="site-nav-link" href="/replays" aria-current="page">回放</a
          ><a class="site-nav-link" href="/about">关于</a>
        </nav>
        <div class="site-account" aria-label="账号">
          <span class="site-account-name" id="site-account-name" hidden></span
          ><a class="btn btn-primary btn-sm" id="site-login" href="/login">登录</a
          ><button class="btn btn-ghost btn-sm" id="site-logout" type="button" hidden>退出登录</button>
        </div>
      </div>
    </header>
    <main id="app">
      <h1 class="doc-title">回放</h1>
      <section class="doc-panel">
        <h2>查询回放</h2>
        <form class="replay-query" id="replay-query">
          <label>用户名<input id="query-username" name="username" autocomplete="off" /></label
          ><label>开始日期<input id="query-from" name="from" type="date" /></label
          ><label>结束日期<input id="query-to" name="to" type="date" /></label
          ><button class="btn btn-primary" type="submit">查询</button>
        </form>
      </section>
      <section class="doc-panel">
        <h2 id="replays-heading">最新回放</h2>
        <p id="replays-status" role="status" aria-live="polite"></p>
        <div class="replay-table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>回合</th>
                <th>结果</th>
              </tr>
            </thead>
            <tbody id="replays-body"></tbody>
          </table>
        </div>
        <div class="replay-pagination" id="replays-pagination" hidden>
          <button class="btn btn-secondary" id="replays-prev" type="button">上一页</button
          ><span id="replays-page"></span
          ><button class="btn btn-secondary" id="replays-next" type="button">下一页</button
          ><button class="btn btn-ghost" id="replays-latest" type="button">返回最新</button>
        </div>
      </section>
      <section class="doc-panel">
        <h2>上传 RPL</h2>
        <p id="replay-login">登录后可上传并查看回放 · <a href="/login">登录</a></p>
        <div id="replay-upload" hidden>
          <label>选择回放文件 <input id="replay-upload-file" type="file" accept=".rpl" /></label
          ><button class="btn btn-primary" id="replay-upload-view" type="button" disabled>查看</button>
        </div>
      </section>
    </main>
  </body>
</html>
